====================== -->
<body>
<div class="container">
<h1>Sistema Inteligente de Avaliação com IA</h1>
<div class="author">Iraê César Brandão - Desenvolvedor  (Versão 1.4.0 )  Data: 04-abril-2026</div>

<div class="card">
<h3>Cadastro</h3>

<input id="nome" placeholder="Nome">
<input id="idade" placeholder="Idade">
<input id="formacao" placeholder="Formação">
<input id="area" placeholder="Área">
<input id="periodo" placeholder="Período">
<textarea id="objetivo" placeholder="Objetivos/Observações do Perfil (pressionar enter após cada observação)"></textarea>

<h3>Competências</h3>
<div id="inputs"></div>

<!-- ====================
    BOTÕES
====================== -->
<button class="btn" onclick="salvar()">Salvar</button>
<button class="btn-danger" onclick="limparTudo()">Limpar Tudo</button>
<button onclick="exportarExcel()">Exportar Excel</button>
<button onclick="exportarCompleto()">Backup JSON</button>
<input type="file" accept=".json" onchange="importarCompleto(event)">
</div>


<!-- ====================
TABELA RESULTDOS
====================== -->
<div class="card">
<h3>Base de Avaliações</h3>
<table>
<thead>
<tr>
<th>Nome</th>
<th>Média</th>
<th>%</th>
<th>Perfil</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>
</div>


<!-- ====================
 GRÁFICOS DASHBOARD
====================== -->
<div class="card">
<h3>Dashboard</h3>
<div class="flex">
<canvas id="graficoRadar"></canvas>
<canvas id="graficoLinha"></canvas>
</div>
<div id="sugestoes"></div>
<button class="btn-info" onclick="gerarPDF()">Exportar PDF</button>
</div>

</div>

<!-- ====================
         SCRIPTS JS
====================== -->
<script>

/* ========= UTIL ========= */
function gerarId(texto){
 return texto
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/\s+/g,"_")
  .replace(/[^\w]/g,"");
}

/* ========= CONFIG ========= */
const competencias = [
"Auto-motivação","Bom humor","Produção de conhecimento",
"Liderança","Relacionamento interpessoal","Criatividade","Capacidade de sonhar"
];

let banco = JSON.parse(localStorage.getItem("empresa") || "[]");
let selecionado = null;

/* ========= INPUTS ========= */
const div = document.getElementById("inputs");

competencias.forEach(c=>{
 let id = gerarId(c);
 div.innerHTML += `
  <label>${c}</label>
  <input type="number" min="1" max="10" id="${id}" placeholder="Nota 1-10">
 `;
});

/* ========= CALC ========= */
function calcular(){
 let soma=0;
 competencias.forEach(c=>{
  soma += parseFloat(document.getElementById(gerarId(c)).value) || 0;
 });
 let media = soma/competencias.length;
 let perc = (media/10)*100;
 return {media, perc};
}

function classificarPerfil(media){
 if(media<=2) return {perfil:"Crítico",codigo:"P0",score:0};
 if(media<=3.5) return {perfil:"Ruim",codigo:"P1",score:1};
 if(media<=6) return {perfil:"Instável",codigo:"P2",score:2};
 if(media<=7.5) return {perfil:"Funcional",codigo:"P3",score:3};
 if(media<=9.5) return {perfil:"Proficiente",codigo:"P4",score:4};
 return {perfil:"Excelente",codigo:"P5",score:5};
}

/* ========= SALVAR ========= */
function salvar(){

 let calc = calcular();
 let perfil = classificarPerfil(calc.media);

 let notas = {};
 competencias.forEach(c=>{
  notas[c] = document.getElementById(gerarId(c)).value;
 });

 if(selecionado){

  Object.assign(selecionado,{
   nome:nome.value,
   idade:idade.value,
   formacao:formacao.value,
   area:area.value,
   periodo:periodo.value,
   objetivo:objetivo.value,
   notas,
   media:calc.media,
   perc:calc.perc,
   perfil
  });

  selecionado.historico.push({
   data:new Date().toLocaleDateString(),
   media:calc.media
  });

 } else {

  banco.push({
   nome:nome.value,
   idade:idade.value,
   formacao:formacao.value,
   area:area.value,
   periodo:periodo.value,
   objetivo:objetivo.value,
   notas,
   historico:[{data:new Date().toLocaleDateString(), media:calc.media}],
   media:calc.media,
   perc:calc.perc,
   perfil
  });

 }

 localStorage.setItem("empresa", JSON.stringify(banco));
 atualizarTabela();
 limparFormulario();
}

/* ========= UI ========= */
function limparFormulario(){
 selecionado=null;
 document.querySelectorAll("input, textarea").forEach(el=> el.value="");
}

function atualizarTabela(){
 let tb = document.getElementById("tabela");
 tb.innerHTML="";

 banco.forEach((d,i)=>{
  tb.innerHTML+=`
  <tr>
   <td>${d.nome}</td>
   <td>${d.media.toFixed(2)}</td>
   <td>${d.perc.toFixed(1)}%</td>
   <td>${d.perfil?.codigo} (${d.perfil?.score})<br>${d.perfil?.perfil}</td>
   <td>
    <button onclick="editar(${i})">Editar</button>
    <button onclick="dashboard(${i})">Dashboard</button>
    <button onclick="excluir(${i})">Excluir</button>
   </td>
  </tr>`;
 });
}

/* ========= AÇÕES ========= */
function editar(i){
 selecionado = banco[i];

 nome.value = selecionado.nome;
 idade.value = selecionado.idade;
 formacao.value = selecionado.formacao;
 area.value = selecionado.area;
 periodo.value = selecionado.periodo;
 objetivo.value = selecionado.objetivo;

 for(let c in selecionado.notas){
  document.getElementById(gerarId(c)).value = selecionado.notas[c];
 }
}

function excluir(i){
 banco.splice(i,1);
 localStorage.setItem("empresa", JSON.stringify(banco));
 atualizarTabela();
}

/* ========= DASHBOARD ========= */
function dashboard(i){
 selecionado = banco[i];

 let valores = competencias.map(c=> selecionado.notas[c] || 0);

 if(window.radar) window.radar.destroy();
 window.radar = new Chart(graficoRadar,{
  type:'radar',
  data:{labels:competencias,datasets:[{label:'Competências',data:valores}]}
 });

 let labels = selecionado.historico.map(h=>h.data);
 let dados = selecionado.historico.map(h=>h.media);

 if(window.linha) window.linha.destroy();
 window.linha = new Chart(graficoLinha,{
  type:'line',
  data:{labels:labels,datasets:[{label:'Evolução',data:dados}]}
 });
}

/* ========= PDF COMPLETO ========= */
function gerarPDF(){

 if(!selecionado){
  alert("Selecione um usuário");
  return;
 }

 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();

 let y=15;

 function add(texto){
  let linhas = doc.splitTextToSize(texto,180);
  linhas.forEach(l=>{
   if(y>280){doc.addPage();y=15;}
   doc.text(l,15,y);
   y+=7;
  });
 }

 add("RELATÓRIO COMPLETO");
 add("Nome: "+selecionado.nome);
 add("Idade: "+selecionado.idade);
 add("Formação: "+selecionado.formacao);
 add("Área: "+selecionado.area);
 add("Período: "+selecionado.periodo);

 add("Perfil: "+selecionado.perfil?.perfil);
 add("Código: "+selecionado.perfil?.codigo);
 add("Score: "+selecionado.perfil?.score);

 add("Média: "+selecionado.media.toFixed(2));
 add("Percentual: "+selecionado.perc.toFixed(1)+"%");

 add("Competências:");
 for(let c in selecionado.notas){
  add(c+": "+selecionado.notas[c]);
 }

 add("Objetivo:");
 add(selecionado.objetivo || "-");

 add("Histórico:");
 (selecionado.historico||[]).forEach(h=>{
  add(h.data+" → "+h.media.toFixed(2));
 });

 doc.save("relatorio_"+selecionado.nome+".pdf");
}

/* ========= EXPORT ========= */
function exportarExcel(){
 const dados = banco.map(p=>{
  let obj={Nome:p.nome,Media:p.media,Percentual:p.perc};
  for(let c in p.notas){ obj[c]=p.notas[c]; }
  return obj;
 });
 const ws = XLSX.utils.json_to_sheet(dados);
 const wb = XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb, ws, "Dados");
 XLSX.writeFile(wb, "avaliacoes.xlsx");
}

function exportarCompleto(){
 const blob = new Blob([JSON.stringify(banco,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="backup.json";
 a.click();
}

/* ========= IMPORT ========= */
function importarCompleto(event){

 const file = event.target.files[0];
 if(!file) return;

 const reader = new FileReader();

 reader.onload = function(e){
  try{
   const dados = JSON.parse(e.target.result);

   banco = dados.map(p=>{
    if(!p.perfil && p.media){
     p.perfil = classificarPerfil(p.media);
    }
    if(!p.historico) p.historico=[];
    if(!p.notas) p.notas={};
    return p;
   });

   localStorage.setItem("empresa", JSON.stringify(banco));
   atualizarTabela();

   alert("Importado com sucesso!");

  }catch{
   alert("Erro no JSON");
  }
 };

 reader.readAsText(file);
}

/* ========= LIMPAR ========= */
function limparTudo(){
 if(!confirm("Apagar tudo?")) return;
 localStorage.removeItem("empresa");
 banco=[];
 atualizarTabela();
}

atualizarTabela();

</script>
